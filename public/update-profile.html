<html lang="en"><head><style>html { zoom: 0.9; }</style>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Update Profile - CloudNotes</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#8b5cf6",
                        "primary-dark": "#6d28d9",
                        "background-light": "#fdfcff",
                        "background-dark": "#1a1625",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "sans": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display transition-colors duration-300 min-h-screen antialiased">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<!-- Header Section -->
<header class="bg-white dark:bg-slate-900 border-b border-primary/10 sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex flex-col md:flex-row items-center py-4 md:py-6 gap-6 justify-between">
<div class="flex items-center gap-2 shrink-0">
<h1 class="text-primary text-2xl md:text-3xl font-black tracking-tight uppercase">CloudNotes</h1>
<span class="w-1.5 h-1.5 rounded-full bg-primary/30"></span>
<p class="text-slate-500 dark:text-slate-400 text-xs font-medium uppercase tracking-widest hidden sm:block">Notes</p>
</div>
<nav class="flex flex-wrap justify-center items-center gap-2 bg-slate-50 dark:bg-slate-800/50 p-1.5 rounded-xl shrink-0">
<a class="flex items-center gap-2 px-4 py-2 md:px-6 md:py-2.5 rounded-lg text-slate-600 hover:bg-white hover:text-primary transition-all" href="dashboard.html">
<span class="material-symbols-outlined text-[20px]">description</span>
<span class="text-sm font-bold hidden sm:block">Notes</span>
</a>
<a class="flex items-center gap-2 px-4 py-2 md:px-6 md:py-2.5 rounded-lg bg-primary text-white shadow-lg shadow-primary/20 transition-all cursor-pointer" onclick="window.location.href='profile.html'">
<span class="material-symbols-outlined fill-[1] text-[20px]">account_circle</span>
<span class="text-sm font-bold hidden sm:block">Profile</span>
</a>
</nav>
</div>
</div>
</header>
<!-- Main Content Section -->
<main class="flex-1 flex items-center justify-center p-6 md:p-12 bg-background-light dark:bg-background-dark">
<div class="w-full max-w-2xl bg-white dark:bg-slate-900 rounded-lg shadow-sm overflow-hidden border border-slate-200 dark:border-slate-800">
<div class="h-32 w-full bg-primary/5 border-b border-slate-100 dark:border-slate-800 relative">
<div class="absolute -bottom-10 left-8">
<div class="size-20 rounded-xl border-4 border-white dark:border-slate-900 shadow-md overflow-hidden bg-white">
<div class="h-full w-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-4xl text-primary">person</span>
</div>
</div>
</div>
</div>
<!-- Form Content -->
<div class="px-8 pt-14 pb-10">
<div class="mb-8 flex items-center justify-between">
<div>
<h2 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Update Profile</h2>
<p class="text-slate-500 dark:text-slate-400 mt-1">Manage your account information and contact details</p>
</div>
</div>
<form id="updateProfileForm" class="space-y-6">
<div class="grid grid-cols-1 gap-6">
<!-- Full Name -->
<div class="flex flex-col gap-2">
<label class="text-sm font-bold text-slate-700 dark:text-slate-300" for="full-name">Full Name</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
<span class="material-symbols-outlined text-[20px]">badge</span>
</span>
<input id="updName" required class="block w-full rounded-lg border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 pl-10 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary py-3 transition-colors" type="text"/>
</div>
</div>
<!-- Email Address -->
<div class="flex flex-col gap-2">
<label class="text-sm font-bold text-slate-700 dark:text-slate-300" for="email">Email Address</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
<span class="material-symbols-outlined text-[20px]">mail</span>
</span>
<input id="updEmail" required class="block w-full rounded-lg border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 pl-10 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary py-3 transition-colors" type="email"/>
</div>
</div>
<!-- Mobile Number -->
<div class="flex flex-col gap-2">
<label class="text-sm font-bold text-slate-700 dark:text-slate-300" for="phone">Mobile Number</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
<span class="material-symbols-outlined text-[20px]">call</span>
</span>
<input id="updPhone" required class="block w-full rounded-lg border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 pl-10 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary py-3 transition-colors" type="number"/>
</div>
</div>
</div>
<div id="updateMsg" class="text-sm font-semibold text-center"></div>
<div class="pt-8 flex flex-col sm:flex-row gap-4 justify-center border-t border-slate-100 dark:border-slate-800">
<button onclick="window.history.back()" class="px-8 py-3 text-sm font-semibold text-slate-600 dark:text-slate-400 hover:text-primary transition-colors" type="button">
                                Cancel
                            </button>
<button class="flex items-center justify-center gap-2 rounded-full bg-primary hover:bg-primary-dark px-12 py-3 text-sm font-bold text-white shadow-lg shadow-primary/20 transition-all hover:scale-[1.02]" type="submit">
<span class="material-symbols-outlined text-[18px]">save</span>
<span>Update Profile</span>
</button>
</div>
</form>
</div>
</div>
</main>
<footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-8">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex flex-col md:flex-row justify-between items-center gap-4">
<p class="text-slate-500 dark:text-slate-400 text-sm">© 2024 CloudNotes. All rights reserved.</p>
<div class="flex items-center gap-6">
<a class="text-slate-500 dark:text-slate-400 hover:text-primary text-sm transition-colors" href="#">Privacy Policy</a>
</div>
</div>
</div>
</footer>
</div>

<script>
    const API = "http://localhost:5000";
    const user = JSON.parse(localStorage.getItem("data"));

    if (!user) {
        window.location.href = "login.html";
    } else {
        document.getElementById('updName').value = user.name || '';
        document.getElementById('updEmail').value = user.email || '';
        document.getElementById('updPhone').value = user.mobile || '';
    }

    document.getElementById("updateProfileForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msgDiv = document.getElementById("updateMsg");
        const name = document.getElementById('updName').value.trim();
        const email = document.getElementById('updEmail').value.trim();
        const mobile = document.getElementById('updPhone').value.trim();

        msgDiv.innerText = "Updating...";
        msgDiv.className = "text-sm font-semibold text-center text-slate-500";

        try {
            const res = await fetch(API + "/update-profile", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: user.id, name, email, mobile }),
            });
            const data = await res.json();
            
            if (res.ok) {
                // update local storage
                localStorage.setItem("data", JSON.stringify(data.data));
                msgDiv.innerText = "Profile updated successfully!";
                msgDiv.className = "text-sm font-semibold text-center text-green-500";
                setTimeout(() => window.location.href = 'profile.html', 1500);
            } else {
                msgDiv.innerText = data.error || "Failed to update.";
                msgDiv.className = "text-sm font-semibold text-center text-red-500";
            }
        } catch(err) {
            msgDiv.innerText = "Error connecting to server.";
            msgDiv.className = "text-sm font-semibold text-center text-red-500";
        }
    });

</script>
</body></html>
