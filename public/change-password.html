<!DOCTYPE html>
<html lang="en"><head><style>html { zoom: 0.9; }</style>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#8b5cf6",
                        "primary-dark": "#6d28d9",
                        "background-light": "#fdfcff",
                        "background-dark": "#1a1625",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "sans": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<title>Change Password - CloudNotes</title>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen antialiased">
<div class="flex flex-col min-h-screen">
<!-- Header -->
<header class="bg-white dark:bg-slate-900 border-b border-primary/10 sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex flex-col md:flex-row items-center py-4 md:py-6 gap-6 justify-between">
<div class="flex items-center gap-2 shrink-0">
<h1 class="text-primary text-2xl md:text-3xl font-black tracking-tight uppercase">CloudNotes</h1>
<span class="w-1.5 h-1.5 rounded-full bg-primary/30"></span>
<p class="text-slate-500 dark:text-slate-400 text-xs font-medium uppercase tracking-widest hidden sm:block">Notes</p>
</div>
<nav class="flex flex-wrap justify-center items-center gap-2 bg-slate-50 dark:bg-slate-800/50 p-1.5 rounded-xl shrink-0">
<a class="flex items-center gap-2 px-4 py-2 md:px-6 md:py-2.5 rounded-lg text-slate-600 hover:bg-white hover:text-primary transition-all" href="dashboard.html">
<span class="material-symbols-outlined text-[20px]">description</span>
<span class="text-sm font-bold hidden sm:block">Notes</span>
</a>
<a class="flex items-center gap-2 px-4 py-2 md:px-6 md:py-2.5 rounded-lg bg-primary text-white shadow-lg shadow-primary/20 transition-all cursor-pointer" onclick="window.location.href='profile.html'">
<span class="material-symbols-outlined fill-[1] text-[20px]">account_circle</span>
<span class="text-sm font-bold hidden sm:block">Profile</span>
</a>
</nav>
</div>
</div>
</header>
<main class="flex-1 py-12 px-4 sm:px-6 lg:px-8">
<div class="max-w-md mx-auto">
<div class="mb-8 text-center">
<h2 class="text-3xl font-bold text-slate-900 dark:text-slate-100">Change Password</h2>
<p class="mt-2 text-slate-500 dark:text-slate-400 font-medium">Manage your account security settings</p>
</div>
<div class="bg-white dark:bg-slate-900 shadow-sm rounded-lg border border-slate-200 dark:border-slate-800 overflow-hidden">
<div class="p-8">
<form id="changePasswordForm" class="space-y-6">
<div>
<label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2" for="current-password">Current Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock_open</span>
<input required class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border-slate-100 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-slate-400 text-sm" id="current-password" placeholder="••••••••" type="password"/>
</div>
</div>
<div>
<label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2" for="new-password">New Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
<input required class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border-slate-100 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-slate-400 text-sm" id="new-password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
<span>Strength</span>
<span class="text-primary">Strong</span>
</div>
<div class="h-1.5 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all" style="width: 75%;"></div>
</div>
<p class="text-[11px] text-slate-400 dark:text-slate-500 italic leading-relaxed">
                                Use at least 8 characters, including letters, numbers, and symbols.
                            </p>
</div>
<div>
<label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2" for="confirm-password">Confirm New Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">verified_user</span>
<input required class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border-slate-100 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-slate-400 text-sm" id="confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="pt-2">
<button class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-3 px-6 rounded-full transition-all flex items-center justify-center gap-2 shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98]" type="submit">
<span class="material-symbols-outlined text-xl">update</span>
                                Update Password
                            </button>
</div>
<div class="text-center">
<a class="text-sm font-medium text-slate-500 hover:text-primary transition-colors cursor-pointer" onclick="window.history.back()">Back</a>
</div>
</form>
</div>
</div>
</div>
</main>
<footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-8 mt-auto text-center md:text-left">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
<p class="text-slate-500 dark:text-slate-400 text-sm">© 2024 CloudNotes. All rights reserved.</p>
</div>
</footer>
</div>

<script>
    const user = JSON.parse(localStorage.getItem("data"));

    if (!user) {
        window.location.href = "login.html";
    }

    document.getElementById("changePasswordForm").addEventListener("submit", (e) => {
        e.preventDefault();
        alert("The backend API currently does not support changing passwords. This is a UI placeholder.");
    });
</script>
</body></html>
