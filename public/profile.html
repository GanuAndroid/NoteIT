<!DOCTYPE html><html lang="en"><head><style>html { zoom: 0.9; }</style>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Profile Settings - CloudNotes</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#8b5cf6",
                        "primary-dark": "#6d28d9",
                        "background-light": "#fdfcff",
                        "background-dark": "#1a1625",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "sans": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen antialiased">
<div class="flex flex-col min-h-screen">
<!-- Header -->
<header class="bg-white dark:bg-slate-900 border-b border-primary/10 sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex flex-col md:flex-row items-center py-4 md:py-6 gap-6 justify-between">
<div class="flex items-center gap-2 shrink-0">
<h1 class="text-primary text-2xl md:text-3xl font-black tracking-tight uppercase">CloudNotes</h1>
<span class="w-1.5 h-1.5 rounded-full bg-primary/30"></span>
<p class="text-slate-500 dark:text-slate-400 text-xs font-medium uppercase tracking-widest hidden sm:block">Notes</p>
</div>
<nav class="flex flex-wrap justify-center items-center gap-2 bg-slate-50 dark:bg-slate-800/50 p-1.5 rounded-xl shrink-0">
<a class="flex items-center gap-2 px-4 py-2 md:px-6 md:py-2.5 rounded-lg text-slate-600 hover:bg-white hover:text-primary transition-all" href="dashboard.html">
<span class="material-symbols-outlined text-[20px]">description</span>
<span class="text-sm font-bold hidden sm:block">Notes</span>
</a>
<a class="flex items-center gap-2 px-4 py-2 md:px-6 md:py-2.5 rounded-lg text-slate-600 hover:bg-white hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined text-[20px]">star</span>
<span class="text-sm font-bold hidden sm:block">Favorites</span>
</a>
<a class="flex items-center gap-2 px-4 py-2 md:px-6 md:py-2.5 rounded-lg text-slate-600 hover:bg-white hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined text-[20px]">group</span>
<span class="text-sm font-bold hidden sm:block">Shared</span>
</a>
<a href="profile.html" class="flex items-center gap-2 px-4 py-2 md:px-6 md:py-2.5 rounded-lg bg-primary text-white shadow-lg shadow-primary/20 transition-all select-none">
    <span class="material-symbols-outlined fill-[1] text-[20px]">account_circle</span>
    <span class="text-sm font-bold hidden sm:block">Profile</span>
</a>
</nav>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 bg-background-light dark:bg-background-dark">
<div class="max-w-4xl mx-auto py-12 px-8">
<!-- Profile Header Card -->
<div class="flex flex-col items-center text-center mb-10">
<div class="relative mb-4">
<div class="size-32 rounded-full border-4 border-white dark:border-slate-800 shadow-xl overflow-hidden bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-focus text-6xl text-primary">person</span>
</div>
</div>
<h2 id="profName" class="text-3xl font-bold text-slate-900 dark:text-slate-100">User</h2>
<p id="profEmail" class="text-slate-500 dark:text-slate-400 mt-1 font-medium">user@example.com</p>
<p id="profPhone" class="text-slate-400 dark:text-slate-500 text-sm">--</p>
</div>
<!-- Settings List -->
<div class="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden mb-8">
<div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800">
<h3 class="text-lg font-bold text-slate-900 dark:text-slate-100">Account Settings</h3>
</div>
<div class="divide-y divide-slate-100 dark:divide-slate-800">
<!-- Update Profile -->
<button onclick="window.location.href='update-profile.html'" class="w-full flex items-center justify-between px-6 py-4 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors group text-left">
<div class="flex items-center gap-4">
<div class="size-10 rounded-lg bg-primary/10 text-primary flex items-center justify-center">
<span class="material-symbols-outlined">person</span>
</div>
<span class="text-slate-700 dark:text-slate-200 font-medium">Update Profile</span>
</div>
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- Change Password -->
<button onclick="window.location.href='change-password.html'" class="w-full flex items-center justify-between px-6 py-4 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors group text-left">
<div class="flex items-center gap-4">
<div class="size-10 rounded-lg bg-primary/10 text-primary flex items-center justify-center">
<span class="material-symbols-outlined">lock</span>
</div>
<span class="text-slate-700 dark:text-slate-200 font-medium">Change Password</span>
</div>
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- Security Settings (Inactive) -->
<button class="w-full flex items-center justify-between px-6 py-4 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors group text-left">
<div class="flex items-center gap-4">
<div class="size-10 rounded-lg bg-primary/10 text-primary flex items-center justify-center">
<span class="material-symbols-outlined">verified_user</span>
</div>
<span class="text-slate-700 dark:text-slate-200 font-medium">Security Setting</span>
</div>
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- Delete Account -->
<button onclick="window.location.href='delete-account.html'" class="w-full flex items-center justify-between px-6 py-4 hover:bg-red-50 dark:hover:bg-red-900/10 transition-colors group text-left">
<div class="flex items-center gap-4">
<div class="size-10 rounded-lg bg-red-100 dark:bg-red-900/30 text-red-600 flex items-center justify-center">
<span class="material-symbols-outlined">delete</span>
</div>
<span class="text-red-600 dark:text-red-400 font-medium">Delete Account</span>
</div>
<span class="material-symbols-outlined text-slate-400 group-hover:text-red-600 transition-colors">chevron_right</span>
</button>
</div>
</div>
<!-- Support Section -->
<div class="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden mb-12">
<div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800">
<h3 class="text-lg font-bold text-slate-900 dark:text-slate-100">Help &amp; Support</h3>
</div>
<div class="divide-y divide-slate-100 dark:divide-slate-800">
<!-- About App -->
<button class="w-full flex items-center justify-between px-6 py-4 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors group text-left">
<div class="flex items-center gap-4">
<div class="size-10 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 flex items-center justify-center">
<span class="material-symbols-outlined">info</span>
</div>
<span class="text-slate-700 dark:text-slate-200 font-medium">About App</span>
</div>
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- Help & Support -->
<button onclick="window.location.href='help.html'" class="w-full flex items-center justify-between px-6 py-4 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors group text-left">
<div class="flex items-center gap-4">
<div class="size-10 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 flex items-center justify-center">
<span class="material-symbols-outlined">help</span>
</div>
<span class="text-slate-700 dark:text-slate-200 font-medium">Help &amp; Support</span>
</div>
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">chevron_right</span>
</button>
</div>
</div>
<!-- Centered Logout Button -->
<div class="flex justify-center pb-12">
<button onclick="logout()" class="bg-primary hover:bg-primary-dark text-white px-12 py-3 rounded-full font-semibold shadow-lg shadow-primary/20 flex items-center gap-2 transition-all hover:scale-[1.02]">
<span class="material-symbols-outlined">logout</span>
                Logout Account
            </button>
</div>
</div>
</main>
<!-- Footer Section -->
<footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-8">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex flex-col md:flex-row justify-between items-center gap-4">
<p class="text-slate-500 dark:text-slate-400 text-sm">© 2024 NotesApp. All rights reserved.</p>
<div class="flex items-center gap-6">
<a class="text-slate-500 dark:text-slate-400 hover:text-primary text-sm transition-colors" href="#">Privacy Policy</a>
<a class="text-slate-500 dark:text-slate-400 hover:text-primary text-sm transition-colors" href="#">Terms of Service</a>
</div>
</div>
</div>
</footer>
</div>

<script>
    const user = JSON.parse(localStorage.getItem("data"));
    if (!user) {
        window.location.href = "login.html";
    } else {
        document.getElementById('profName').innerText = user.name;
        document.getElementById('profEmail').innerText = user.email;
        document.getElementById('profPhone').innerText = user.mobile || '--';
    }

    function logout() {
        localStorage.removeItem("data");
        window.location.href = "index.html";
    }
</script>
</body></html>
