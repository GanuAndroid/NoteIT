<div class="w-full flex items-center justify-between">

<main class="flex flex-1 items-center justify-center p-4 sm:p-6 lg:p-8">

<div class="bg-white dark:bg-slate-900 rounded-xl shadow-xl shadow-slate-200/50 dark:shadow-none border border-primary/10 overflow-hidden">
<div class="h-48 bg-cover bg-center opacity-90" data-alt="Abstract tech background pattern" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDYUY0btye3cOzvfIYr707zoFN81FCtIPRoWxqLKli37vG4lA_iChGPi8i7OAjpcfqtCHdcvGR4fbFZIs2MfiL-RzTCutuOUcsoC_b5rW2_djg3bfDEwIcvO4li4peMb1AI6gSJVKK7XUbM7BKjqAF0CjLWVOuqn2kDEfQ5Chkkz709CPAyhomnERSy6CwdXXFMjcOxX4uZmuTCvfC3AkgHPTwA_E21dVAHI5wzonYxqZ_ERmPaR-rqminX308VOpjU4R3VLOAF1Vc"); filter: hue-rotate(45deg) saturate(0.8);'></div>
<div class="p-6 md:p-10 flex flex-col gap-6">
<div class="flex flex-col gap-2">
<h1 class="text-slate-900 dark:text-white text-2xl font-black leading-tight tracking-tight">Forgot password?</h1>
<p class="text-slate-500 dark:text-slate-400 text-base font-normal leading-relaxed">
                                    Enter your email address and we'll send you a link to reset your password.
                                </p>
</div>
<div class="flex flex-col gap-5">
<label class="flex flex-col gap-2">
<span class="text-slate-700 dark:text-slate-300 text-sm font-bold">Email Address</span>
<div class="relative">
<input id="emailOrMobile" class="form-input flex w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 h-12 px-4 text-base focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all placeholder:text-slate-400" placeholder="example@email.com" type="email"/>
</div>
</label>
<div id="forgetMsg" class="text-sm font-semibold text-center"></div>
<button id="sendPasswordBtn" class="flex w-full cursor-pointer items-center justify-center rounded-lg h-12 px-5 bg-primary text-white text-base font-bold leading-normal tracking-wide hover:bg-primary/90 hover:scale-[1.01] active:scale-[0.98] transition-all shadow-lg shadow-primary/30">
<span class="truncate">Send Password</span>
</button>
</div>
<div class="flex flex-col items-center mt-2">
<a class="text-primary text-sm font-bold hover:underline underline-offset-4 transition-all" href="login.html">
                                    Back to Log in
                                </a>
</div>
</div>
</div>
<div class="flex items-center justify-center gap-2 text-primary/40 dark:text-slate-500">
<span class="material-symbols-outlined text-sm">lock</span>
<p class="text-[10px] uppercase tracking-[0.2em] font-bold">Secure Cloud Verification</p>
</div>
</div>
</main>
<!-- Footer -->
<footer class="mt-auto bg-white dark:bg-slate-900 border-t border-primary/10">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col md:flex-row items-center justify-between gap-4 border-b border-primary/5">
<div class="flex items-center gap-4">
<p class="text-xs font-bold text-primary uppercase tracking-tighter">System Status</p>
<p class="text-xs text-slate-500 flex items-center gap-1.5">
<span class="size-1.5 rounded-full bg-green-500"></span>
                    Operational
                </p>
</div>
</div>
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
<div class="flex flex-col md:flex-row justify-between items-center gap-6">
<div class="flex items-center gap-2">
<h4 class="text-primary text-xl font-black tracking-tight uppercase">CloudNotes</h4>
<span class="text-slate-400 text-sm">© 2024 CloudNotes Inc. All rights reserved.</span>
</div>
<div class="flex items-center gap-8">
<a class="text-sm font-medium text-slate-500 hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="text-sm font-medium text-slate-500 hover:text-primary transition-colors" href="#">Terms of Service</a>
<div class="flex gap-4">
<a class="text-slate-400 hover:text-primary transition-colors" href="#"><span class="material-symbols-outlined text-lg">public</span></a>
<a class="text-slate-400 hover:text-primary transition-colors" href="#"><span class="material-symbols-outlined text-lg">share</span></a>
</div>
</div>
</div>
</div>
</footer>
</div>
</div>

<script>
    const API = "http://localhost:5000";
    const sendBtn = document.getElementById('sendPasswordBtn');
    const msgDiv = document.getElementById('forgetMsg');

    sendBtn.addEventListener('click', () => {
        const email = document.getElementById('emailOrMobile').value.trim();
        msgDiv.innerText = "";
        
        if (!email) {
            msgDiv.innerText = "Please enter your Email.";
            msgDiv.className = "text-sm font-semibold text-center text-red-500 mt-2";
            return;
        }

        msgDiv.innerText = "Sending...";
        msgDiv.className = "text-sm font-semibold text-center text-slate-500 mt-2";

        fetch(API+"/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        })
        .then(res => res.json()
            .then(data => ({ status: res.status, body: data }))
        )
        .then(result => {
            if (result.status === 200) {
                msgDiv.innerText = result.body.message;
                msgDiv.className = "text-sm font-semibold text-center text-green-500 mt-2";
            } else {
                msgDiv.innerText = result.body.message || "Failed to send password."; 
                msgDiv.className = "text-sm font-semibold text-center text-red-500 mt-2";
            }
        })
        .catch(err => {
            console.error(err);
            msgDiv.innerText = "Server error. Please try again.";
            msgDiv.className = "text-sm font-semibold text-center text-red-500 mt-2";
        });
    });
</script>
</body></html>
